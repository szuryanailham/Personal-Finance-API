name: Artoku release

on:
  push:
    branches: [release/v.0.1]
  pull_request:
    branches: [release/v.0.1]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts isolated PostgreSQL and Redis using runner Docker.
      - name: Run unit and integration tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  deploy:
    name: Deploy VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v.0.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    concurrency:
      group: artoku-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy tested commit over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?}" "${VPS_USER:?}" "${VPS_SSH_KEY:?}" "${VPS_KNOWN_HOSTS:?}" "${VPS_APP_DIR:?}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "${VPS_PORT:-22}" =~ ^[0-9]+$ ]]
          [[ "$VPS_APP_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -p "${VPS_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_APP_DIR' '$DEPLOY_SHA'" \
            < scripts/deploy-vps.sh
