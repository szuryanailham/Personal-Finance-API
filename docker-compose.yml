# Hanya database yang dijalankan di Docker.
# Spring Boot app tetap dijalankan di local (mvn spring-boot:run / dari IDE),
# cukup connect ke PostgreSQL ini lewat localhost:5432.

services:
  postgresdb:
    image: postgres:16
    container_name: postgresdb
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root12345}
      POSTGRES_DB: ${DB_NAME:-personal-finance}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal-finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP lokal untuk melihat email OTP: buka http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data: