spring.application.name=personal-finance-api

# Zona waktu bisnis (dipakai untuk default periode "bulan ini")
app.timezone=${APP_TIMEZONE:Asia/Jakarta}

# Origin client yang boleh akses API (pisahkan dengan koma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:personal-finance}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root12345}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.type=com.zaxxer.hikari.HikariDataSource

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true



# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.table=flyway_schema_history

# Debug Flyway activity in the console
logging.level.org.flywaydb=DEBUG
# Upload file import (.xlsx)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Batas maksimum transaksi per export (.xlsx)
app.export.max-rows=${EXPORT_MAX_ROWS:10000}

# ===============================
# Redis (state OTP registrasi)
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===============================
# Mail (pengiriman OTP). Default mengarah ke Mailpit di docker-compose
# ===============================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@personal-finance.local}
app.mail.app-name=${MAIL_APP_NAME:Personal Finance}

# ===============================
# OTP registrasi
# ===============================
app.otp.length=6
app.otp.ttl=5m
app.otp.max-attempts=3
app.otp.max-sends=3
app.otp.lock-duration=5m
app.otp.resend-cooldown=60s

# ===============================
# Login Google: OAuth client ID dari Google Cloud Console (pisahkan dengan koma)
# ===============================
app.google.client-ids=${GOOGLE_CLIENT_IDS:21668910763-94amtsn7776t5e11717b50v852ph8jst.apps.googleusercontent.com}
